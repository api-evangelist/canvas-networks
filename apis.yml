name: Canvas Networks
description: >-
  Canvas Networks was a consumer social media and image-sharing startup founded
  by Christopher "moot" Poole (the founder of 4chan). Launched in private beta
  in early 2011 at canv.as, the platform let users share, annotate, and remix
  images on moderated, topic-based boards, positioning itself as a friendlier,
  more creative take on imageboard culture. It raised roughly $3.6M from
  Andreessen Horowitz (a16z), Union Square Ventures, SV Angel, Lerer Ventures,
  Founder Collective, Ron Conway, and Joshua Schachter, and later pivoted to the
  mobile drawing app DrawQuest. The company shut down on January 21, 2014, citing
  its inability to build a sustainable business model. It was surfaced as an a16z
  portfolio company and added to the API Evangelist network as a stub; enrichment
  confirms it is defunct with no surviving developer, API, or documentation surface.
